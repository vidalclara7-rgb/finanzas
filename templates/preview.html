<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preview · __CAMBIO__</title>
<!-- estilos-app:inicio · los copia kit.py desde index.html; no se editan a mano -->
<!-- estilos-app:fin -->
<!-- revision:inicio · la banda de revisión no forma parte del diseño ni se copia a la app -->
<style>
  body{max-width:430px;margin:0 auto}
  nav{max-width:402px;margin:0 auto}
  .revision{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;background:#000;color:#fff;font-size:13px}
  .revision select{font:inherit;padding:2px 6px;border-radius:6px;border:0}
  .revision label{display:flex;align-items:center;gap:6px}
  .revision__nota{opacity:.7;width:100%}
</style>
<!-- revision:fin -->
</head>
<body>
<!-- revision:inicio -->
<div class="revision" role="region" aria-label="Revisión del preview">
  <strong>Preview · __CAMBIO__</strong>
  <label>Pantalla <select id="rev-pantalla"></select></label>
  <label>Estado <select id="rev-estado"><option value="normal">con datos</option><option value="vacio">vacío</option></select></label>
  <span class="revision__nota">Datos de ejemplo inventados. Esta banda no es parte del diseño.</span>
</div>
<script>
  // La apariencia del preview sigue al esquema del navegador (claro/oscuro) o a ?apariencia=oscura|clara, como la app con «Automática»
  document.documentElement.dataset.apariencia = new URLSearchParams(location.search).get("apariencia") || (matchMedia("(prefers-color-scheme: dark)").matches ? "oscura" : "clara");
  // El kit del preview: ?kit=indigo|nieve|jardin|brulee (por defecto, Índigo)
  document.documentElement.dataset.kit = new URLSearchParams(location.search).get("kit") || "indigo";
  document.addEventListener("DOMContentLoaded", () => {
    const pantallas = [...document.querySelectorAll("[data-pantalla]")];
    const selP = document.getElementById("rev-pantalla"), selE = document.getElementById("rev-estado");
    for (const p of pantallas) selP.append(new Option(p.dataset.titulo || p.dataset.pantalla, p.dataset.pantalla));
    const q = new URLSearchParams(location.search);
    if (q.get("pantalla")) selP.value = q.get("pantalla");
    if (q.get("estado")) selE.value = q.get("estado");
    function aplicar() {
      for (const p of pantallas) {
        p.hidden = p.dataset.pantalla !== selP.value;
        if (!p.hidden) { p.style.display = "flex"; document.getElementById("rev-titulo").textContent = p.dataset.titulo || ""; }
        for (const e of p.querySelectorAll("[data-estado]")) e.hidden = e.dataset.estado !== selE.value;
      }
      for (const a of document.querySelectorAll("[data-ir]")) {
        if (a.dataset.ir === selP.value) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
      }
      history.replaceState(null, "", "?" + new URLSearchParams({ pantalla: selP.value, estado: selE.value }));
    }
    document.addEventListener("click", (ev) => {
      const a = ev.target.closest("[data-ir]");
      if (a) { ev.preventDefault(); selP.value = a.dataset.ir; aplicar(); }
    });
    for (const el of [selP, selE]) el.addEventListener("change", aplicar);
    aplicar();
  });
</script>
<!-- revision:fin -->
<header><div><h1 id="rev-titulo"></h1><span class="m">octubre 2026</span></div></header>
<main>
<!-- pantallas:inicio
  Una <section data-pantalla="<clave>" data-titulo="<título>" style="flex-direction:column;gap:14px">
  por pantalla. Dentro, dos bloques: <div data-estado="normal"> (con datos de ejemplo) y
  <div data-estado="vacio"> (primer uso). Sólo clases de la app (.card, .p-pink, .item, .btn…).
  Marca con data-ui="<nombre>" las piezas que la app tiene que conservar.
-->
<!-- pantallas:fin -->
</main>
<nav>
<!-- nav:inicio · una entrada por pantalla, con data-ir="<clave de la pantalla>", como en la app
  <button data-ir="inicio">…icono…Inicio</button>
-->
<!-- nav:fin -->
</nav>
</body>
</html>
